<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ffffff">
  <meta name="description" content="Yeji Park's personal page.">
  <title>A Restless Soul in Seoul</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./styles.css?v=21">
  <script defer src="./script.js?v=19"></script>
</head>
<body>
  <main class="site-frame" id="top">
    <header class="profile">
      <div class="cover" aria-hidden="true"></div>
      <div class="avatar-wrap">
        <img class="avatar" src="" alt="">
        <span class="verified-badge" aria-label="">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6.5 12.3 3.5 3.4 7.5-7.4"/></svg>
        </span>
      </div>
      <div class="profile-content">
        <h1></h1>
        <p class="bio"></p>
        <div class="primary-links">
          <a class="primary-link whatsapp-link" target="_blank" rel="noopener noreferrer">
            <svg class="whatsapp-icon" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M20.2 11.6a8.5 8.5 0 0 1-12.5 7.5L4 20l1-3.5a8.5 8.5 0 1 1 15.2-4.9Z"></path>
              <path d="M8.6 8.1c.2-.5.5-.5.8-.5h.5c.2 0 .4 0 .5.4l.7 1.6c.1.3.1.5-.1.7l-.5.6c-.2.2-.2.4-.1.6.4.8 1.1 1.5 2 2 .2.1.4.1.6-.1l.7-.8c.2-.2.4-.3.7-.2l1.5.7c.3.1.4.3.4.6 0 .4-.2 1.2-.7 1.5-.5.4-1.1.6-1.8.4-1.2-.3-2.6-1.1-3.8-2.2-1-.9-1.8-2.1-2.1-3.1-.3-.9 0-1.7.4-2.2Z"></path>
            </svg>
            <span class="whatsapp-number"></span>
          </a>
          <button class="primary-link email-copy" type="button">
            <svg class="copy-icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="5.5" y="5" width="13" height="16" rx="1.5"></rect><path d="M9 5V3h6v2M9 10h6M9 14h6"></path></svg>
            <span class="email-address"></span>
            <span class="copy-feedback" aria-live="polite"></span>
          </button>
        </div>
        <div class="find-me">
          <p class="eyebrow"></p>
          <div class="social-links"></div>
        </div>
      </div>
    </header>

    <section class="content-section section-pad" id="bio">
      <div class="section-heading"><h2></h2></div>
      <div class="bio-entries"></div>
    </section>

    <section class="content-section section-pad" id="places">
      <div class="section-heading"><h2></h2></div>
      <div id="map" aria-label="">
        <div class="map-fallback"><b aria-hidden="true">⌖</b><strong></strong></div>
      </div>
    </section>

    <section class="content-section section-pad projects-section" id="projects">
      <div class="section-heading project-heading"><h2></h2></div>
      <div class="project-carousel">
        <div class="project-slide" aria-live="polite"></div>
        <div class="project-controls">
          <button class="carousel-arrow project-prev" type="button" aria-label="Previous project">‹</button>
          <button class="carousel-arrow project-next" type="button" aria-label="Next project">›</button>
        </div>
      </div>
    </section>
  </main>

  <dialog id="photoDialog" class="photo-dialog">
    <button class="dialog-close" type="button" aria-label="Close">×</button>
    <img class="dialog-image" src="" alt="">
    <button class="dialog-photo-arrow dialog-photo-prev" type="button" aria-label="Previous photo">‹</button>
    <button class="dialog-photo-arrow dialog-photo-next" type="button" aria-label="Next photo">›</button>
    <div class="dialog-copy"><small></small><p></p></div>
  </dialog>
</body>
</html>
