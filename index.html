<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ffffff">
  <meta name="description" content="">
  <title></title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./styles.css?v=7">
  <script defer src="./script.js?v=7"></script>
</head>
<body>
  <main class="site-frame" id="top">
    <header class="profile">
      <div class="cover">
        <div class="cover-orb orb-one"></div>
        <div class="cover-orb orb-two"></div>
        <div class="cover-orb orb-three"></div>
        <div class="language" aria-label="Language">
          <button class="active" data-lang="en" aria-label="English">EN</button>
          <span aria-hidden="true">|</span>
          <button data-lang="ko" aria-label="한국어">KR</button>
        </div>
      </div>
      <div class="avatar-wrap">
        <img class="avatar" src="" alt="">
        <span class="verified-badge" aria-label="">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6.5 12.3 3.5 3.4 7.5-7.4"/></svg>
        </span>
      </div>
      <div class="profile-content">
        <h1></h1>
        <p class="bio"></p>
        <div class="primary-links">
          <button class="primary-link email-copy" type="button">
            <span class="email-address"></span>
            <svg class="copy-icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="8" y="8" width="12" height="12" rx="2"></rect><path d="M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2"></path></svg>
            <span class="copy-feedback" aria-live="polite"></span>
          </button>
        </div>
        <div class="find-me">
          <p class="eyebrow"></p>
          <div class="social-links"></div>
        </div>
      </div>
    </header>

    <section class="miro-section section-pad" aria-labelledby="cat-name">
      <a class="miro-card" target="_blank" rel="noreferrer">
        <img src="" alt="" loading="lazy">
        <span class="miro-copy"><strong id="cat-name"></strong><span></span></span>
        <span class="play-button" aria-hidden="true">▶</span>
      </a>
    </section>

    <section class="content-section section-pad" id="gallery">
      <div class="section-heading"><h2></h2></div>
      <div class="map-card">
        <div id="map" aria-label="">
          <div class="map-fallback"><b>⌖</b><strong></strong></div>
        </div>
      </div>
      <div class="photo-heading"><h3></h3></div>
      <div class="place-tabs" role="group"></div>
      <div class="photos"></div>
    </section>

    <section class="content-section section-pad" id="life">
      <div class="section-heading"><h2></h2></div>
      <div class="resume-grid">
        <article class="resume-card experience-card">
          <div class="card-heading"><span>↗</span><h3></h3></div>
          <div class="resume-entries"></div>
        </article>
        <article class="resume-card education-card">
          <div class="card-heading"><span>✳</span><h3></h3></div>
          <div class="resume-entries"></div>
        </article>
      </div>
    </section>

    <section class="content-section section-pad projects-section" id="projects">
      <div class="section-heading"><h2></h2></div>
      <div class="projects-grid"></div>
    </section>
  </main>

  <dialog id="photoDialog" class="photo-dialog">
    <button class="dialog-close" type="button"></button>
    <img class="dialog-image" src="" alt="">
    <div class="dialog-copy"><small></small><h2></h2><p></p></div>
  </dialog>
</body>
</html>
